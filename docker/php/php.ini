upload_max_filesize = 20M
post_max_size = 20M
memory_limit = 256M
max_execution_time = 120
date.timezone = UTC

opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
; Re-check source files on every request rather than only on container
; restart — the app directory is bind-mounted, so this keeps edits live.
opcache.validate_timestamps = 1
